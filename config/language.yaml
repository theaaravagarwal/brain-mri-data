  transfer_direction: nvidia_push_to_amd
  automatic_execution: false
  forbidden_capabilities: [raw_image_access, model_routing, diagnosis, treatment, patient_specific_advice]
  required_disclaimer: Research output only; not a diagnosis or treatment recommendation.
